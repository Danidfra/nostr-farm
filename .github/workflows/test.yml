name: Test

on:
  push:
    branches: [ "main" ]
  # Every pull request, whatever branch it targets, so feature branches are
  # checked before they merge. `pull_request` (never `pull_request_target`)
  # runs fork code with a read-only token and no repository secrets.
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs; the tag each SHA was resolved
      # from is in the comment.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins. Reinstalling
      # from package.json alone let CI test dependency versions no developer
      # had run locally.
      - name: Install dependencies
        run: npm ci

      # Typecheck, lint, unit tests, production build, dev-chunk and base checks.
      - name: Run tests
        run: npm run test

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Fails on a high or critical advisory in a dependency that ships with
      # the app. Reads the lockfile against the advisory database; nothing is
      # installed or run.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
