name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins. Reinstalling
      # from package.json alone let CI test dependency versions no developer
      # had run locally.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
